name: ci pr
# continuous integration on pull requests to main and dkg/dev

on:
  pull_request:
    branches:
      - main
      - dkg/dev

permissions:
  contents: read
  pull-requests: read

jobs:
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml
  go-tests:
    uses: ./.github/workflows/gotest.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  go-lint:
    uses: ./.github/workflows/golangci-lint.yml
  sol-tests:
    uses: ./.github/workflows/ci-foundry.yml
