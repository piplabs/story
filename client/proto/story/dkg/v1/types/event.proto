syntax = "proto3";
package story.dkg.v1.types;

option go_package = "github.com/piplabs/story/client/x/dkg/types";

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_BEGIN_INITIALIZATION = 1;
  EVENT_TYPE_BEGIN_DEALING = 2;
  EVENT_TYPE_BEGIN_PROCESS_DEALS = 3;
  EVENT_TYPE_BEGIN_PROCESS_RESPONSES = 4;
  EVENT_TYPE_BEGIN_FINALIZATION = 5;
  EVENT_TYPE_DKG_FINALIZED = 6;
  EVENT_TYPE_BEGIN_PROCESS_JUSTIFICATIONS = 7;
}

message EventBeginInitialization {
  bytes code_commitment = 1;
  uint32 round = 2;
  uint32 start_block_height = 3;
  repeated string active_validators = 4;
}

message EventBeginDealing {
  bytes code_commitment = 1;
  uint32 round = 2;
}

message EventBeginProcessDeals {
  bytes code_commitment = 1;
  uint32 round = 2;
  uint32 num_deals = 3;
}

message EventBeginProcessResponses {
  bytes code_commitment = 1;
  uint32 round = 2;
  uint32 num_responses = 3;
}

message EventBeginProcessJustifications {
  bytes code_commitment = 1;
  uint32 round = 2;
  uint32 num_justifications = 3;
}

message EventBeginFinalization {
  bytes code_commitment = 1;
  uint32 round = 2;
}

message EventDKGFinalized {
  bytes code_commitment = 1;
  uint32 round = 2;
}

message EventDKGCommitteeRewarded {
  bytes code_commitment = 1;
  uint32 round = 2;
  uint32 member_count = 3;
  string total_reward = 4;
  string per_member_reward = 5;
  string remaining_ubi = 6;
}
