syntax = "proto3";
package story.dkg.v1.types;

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/piplabs/story/client/x/dkg/types";

// Params defines the parameters for the module.
// All timeouts are in seconds.
message Params {
  uint32 registration_period = 1 [
    (gogoproto.moretags) = "yaml:\"registration_period\""
  ];

  uint32 dealing_period = 2 [
    (gogoproto.moretags) = "yaml:\"dealing_period\""
  ];

  uint32 finalization_period = 3 [
    (gogoproto.moretags) = "yaml:\"finalization_period\""
  ];

  uint32 active_period = 4 [
    (gogoproto.moretags) = "yaml:\"active_period\""
  ];

  // portion of UBI rewards allocated to the DKG committee (e.g. "0.10" = 10%)
  string dkg_committee_reward_portion = 5 [
    (cosmos_proto.scalar)  = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable)   = false,
    (gogoproto.moretags)   = "yaml:\"dkg_committee_reward_portion\""
  ];

  // minimum number of verified registrations required to enter dealing stage
  uint32 min_req_registered_participants = 6 [
    (gogoproto.moretags) = "yaml:\"min_req_registered_participants\""
  ];

  // minimum number of finalized participants required to complete a DKG round
  uint32 min_req_finalized_participants = 7 [
    (gogoproto.moretags) = "yaml:\"min_req_finalized_participants\""
  ];

  // operational threshold in basis points (0-1000) used to calculate round threshold
  // threshold = total * operational_threshold / 1000
  uint32 operational_threshold = 8 [
    (gogoproto.moretags) = "yaml:\"operational_threshold\""
  ];

}
